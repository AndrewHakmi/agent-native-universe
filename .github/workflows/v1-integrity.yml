name: distributed-v1-integrity

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/v1-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply idempotent runtime hardening and exports
        shell: bash
        run: |
          set -euo pipefail
          cat > src/v1/compat.d.ts <<'EOF'
          export {};
          EOF
          python - <<'PY'
          from pathlib import Path

          security = Path('src/v1/security-transport.ts')
          text = security.read_text()
          if 'createPrivateKey,' not in text:
              text = text.replace('  createHash,\n  createPublicKey,', '  createHash,\n  createPrivateKey,\n  createPublicKey,')
          text = text.replace('    const { createPrivateKey } = requireCrypto();\n    return new CryptoIdentity(', '    return new CryptoIdentity(')
          start = text.find('\nfunction requireCrypto():')
          if start != -1:
              end = text.find('\n\nexport class ReplayWindow', start)
              if end == -1:
                  raise SystemExit('cannot locate requireCrypto block end')
              text = text[:start] + text[end:]
          security.write_text(text)

          persistence = Path('src/v1/persistence-consensus.ts')
          text = persistence.read_text()
          text = text.replace('import { randomUUID } from "node:crypto";', 'import { createPublicKey, randomUUID, verify as cryptoVerify } from "node:crypto";')
          text = text.replace('identity.signValue(proposalUnsigned({ ...base, signature: undefined } as never))', 'identity.signValue(proposalUnsigned(base))')
          text = text.replace('identity.signValue(voteUnsigned({ ...base, signature: undefined } as never))', 'identity.signValue(voteUnsigned(base))')
          text = text.replace('identity.signValue(viewChangeUnsigned({ ...base, signature: undefined } as never))', 'identity.signValue(viewChangeUnsigned(base))')
          old = '''function verifyDetached(publicKeyPem: string, value: JsonValue, signature: string): boolean {\n  const { verify, createPublicKey } = require("node:crypto") as typeof import("node:crypto");\n  return verify(null, Buffer.from(canonicalJson(value), "utf8"), createPublicKey(publicKeyPem), Buffer.from(signature, "base64"));\n}\n'''
          new = '''function verifyDetached(publicKeyPem: string, value: JsonValue, signature: string): boolean {\n  return cryptoVerify(null, Buffer.from(canonicalJson(value), "utf8"), createPublicKey(publicKeyPem), Buffer.from(signature, "base64"));\n}\n'''
          if old in text:
              text = text.replace(old, new)
          persistence.write_text(text)

          exports = Path('src/v1/index.ts')
          text = exports.read_text()
          for line in [
              'export * from "./identity-store.js";\n',
              'export * from "./node-runner.js";\n',
          ]:
              if line not in text:
                  text += line
          exports.write_text(text)
          PY
      - run: npm ci --ignore-scripts
      - name: Verify all behavior
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/anu-tests.log
          grep -q '^# fail 0$' /tmp/anu-tests.log
      - name: Commit integrity evidence on current master
        shell: bash
        run: |
          set -euo pipefail
          tests="$(awk '/^# tests / {value=$3} END {print value}' /tmp/anu-tests.log)"
          test -n "$tests"
          mkdir -p validation
          cat > validation/distributed-v1.json <<JSON
          {
            "sourceCommit": "${GITHUB_SHA}",
            "node": "$(node --version)",
            "status": "verified",
            "tests": ${tests},
            "failures": 0,
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v1/compat.d.ts src/v1/security-transport.ts src/v1/persistence-consensus.ts src/v1/index.ts validation/distributed-v1.json
          if git diff --cached --quiet; then
            echo "Integrity state already current"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Verify distributed v1 runtime integrity"
          git pull --rebase origin master
          git push origin HEAD:master
