name: network-bft-upgrade

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/network-bft-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize networked BFT rounds
        shell: bash
        run: |
          set -euo pipefail
          cat > src/v1/network-bft-node.ts <<'EOF'
          import { mkdir, open, readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          import {
            CryptoIdentity,
            IdentityRegistry,
            SecureTransport,
            TcpTransport,
            type JsonObject,
            type JsonValue,
            type NetworkAddress,
            type PublicIdentity,
            type SignedEnvelope,
          } from "./security-transport.js";
          import {
            ByzantineQuorum,
            type CommitCertificate,
            type ConsensusProposal,
            type ConsensusVote,
            type ViewChange,
          } from "./consensus.js";
          import { PersistentGraphStore, type DurableCommand } from "./persistence-consensus.js";
          import {
            reduceRuntimeState,
            type DistributedRuntimeState,
            type DistributedPeer,
          } from "./distributed-node.js";

          export interface NetworkBftNodeConfig {
            identity: CryptoIdentity;
            committee: PublicIdentity[];
            peers: DistributedPeer[];
            storageDirectory: string;
            listen?: NetworkAddress;
            checkpointEvery?: number;
            proposalTimeoutMs?: number;
          }

          export interface ProposalResult<T extends JsonObject = JsonObject> {
            proposal: ConsensusProposal<T>;
            certificate: CommitCertificate<T>;
            state: DistributedRuntimeState;
          }

          interface ProposalRound<T extends JsonObject = JsonObject> {
            proposal: ConsensusProposal<T>;
            votes: Map<string, ConsensusVote>;
            resolve: (certificate: CommitCertificate<T>) => void;
            reject: (error: Error) => void;
            timer: NodeJS.Timeout;
          }

          interface SyncRequest extends JsonObject {
            fromSequence: number;
          }

          interface SyncResponse extends JsonObject {
            certificates: JsonValue[];
          }

          interface ViewChangePayload extends JsonObject {
            change: JsonValue;
          }

          const EMPTY_STATE: DistributedRuntimeState = {
            format: 1,
            sequence: 0,
            appliedCommandIds: [],
            graph: { agents: [], links: [], metaAgents: [] },
            balances: {},
            journal: [],
          };

          class CertificateJournal {
            readonly #path: string;
            #certificates = new Map<number, CommitCertificate>();

            constructor(readonly directory: string) {
              this.#path = join(directory, "certificates.jsonl");
            }

            async initialize(): Promise<void> {
              await mkdir(this.directory, { recursive: true });
              try {
                const text = await readFile(this.#path, "utf8");
                for (const line of text.split("\n").filter(Boolean)) {
                  const certificate = JSON.parse(line) as CommitCertificate;
                  this.#certificates.set(certificate.proposal.sequence, certificate);
                }
              } catch (error) {
                if ((error as NodeJS.ErrnoException).code !== "ENOENT") throw error;
                await writeFile(this.#path, "", "utf8");
              }
            }

            async append(certificate: CommitCertificate): Promise<void> {
              if (this.#certificates.has(certificate.proposal.sequence)) return;
              const handle = await open(this.#path, "a");
              try {
                await handle.writeFile(`${JSON.stringify(certificate)}\n`, "utf8");
                await handle.sync();
              } finally {
                await handle.close();
              }
              this.#certificates.set(certificate.proposal.sequence, structuredClone(certificate));
            }

            after(sequence: number): CommitCertificate[] {
              return [...this.#certificates.entries()]
                .filter(([current]) => current > sequence)
                .sort(([a], [b]) => a - b)
                .map(([, certificate]) => structuredClone(certificate));
            }
          }

          export class NetworkBftGraphNode {
            readonly identity: CryptoIdentity;
            readonly quorum: ByzantineQuorum;
            readonly registry = new IdentityRegistry();
            readonly tcp = new TcpTransport();
            readonly secure: SecureTransport;
            readonly store: PersistentGraphStore<DistributedRuntimeState & JsonValue>;
            readonly certificates: CertificateJournal;
            readonly #peers = new Map<string, DistributedPeer>();
            readonly #rounds = new Map<string, ProposalRound>();
            readonly #viewChanges = new Map<number, Map<string, ViewChange>>();
            readonly #commitHandlers = new Set<(state: DistributedRuntimeState, certificate: CommitCertificate) => void | Promise<void>>();
            readonly #syncWaiters = new Map<string, { resolve: () => void; reject: (error: Error) => void; timer: NodeJS.Timeout }>();
            #state: DistributedRuntimeState = structuredClone(EMPTY_STATE);
            #unsubscribe?: () => void;
            #commitChain: Promise<void> = Promise.resolve();
            #started = false;

            constructor(readonly config: NetworkBftNodeConfig) {
              this.identity = config.identity;
              this.quorum = new ByzantineQuorum(config.committee);
              for (const member of config.committee) this.registry.register(member);
              this.registry.register(config.identity.publicIdentity());
              for (const peer of config.peers) this.addPeer(peer);
              this.secure = new SecureTransport(this.identity, this.registry, this.tcp);
              this.store = new PersistentGraphStore<DistributedRuntimeState & JsonValue>(config.storageDirectory);
              this.certificates = new CertificateJournal(config.storageDirectory);
            }

            get state(): DistributedRuntimeState {
              return structuredClone(this.#state);
            }

            get address(): NetworkAddress {
              return this.tcp.address;
            }

            get isLeader(): boolean {
              return this.identity.id === this.quorum.leader();
            }

            addPeer(peer: DistributedPeer): void {
              if (peer.id === this.identity.id) return;
              this.registry.register(peer.identity);
              this.#peers.set(peer.id, structuredClone(peer));
            }

            onCommit(handler: (state: DistributedRuntimeState, certificate: CommitCertificate) => void | Promise<void>): () => void {
              this.#commitHandlers.add(handler);
              return () => this.#commitHandlers.delete(handler);
            }

            async start(): Promise<NetworkAddress> {
              if (this.#started) return this.address;
              await this.certificates.initialize();
              const recovered = await this.store.recover(
                structuredClone(EMPTY_STATE) as DistributedRuntimeState & JsonValue,
                (state, command) => reduceRuntimeState(state as DistributedRuntimeState, command) as DistributedRuntimeState & JsonValue,
              );
              this.#state = recovered.state as DistributedRuntimeState;
              const address = await this.tcp.start(this.config.listen ?? { host: "127.0.0.1", port: 0 });
              this.#unsubscribe = this.secure.onEnvelope((envelope) => this.#receive(envelope));
              this.#started = true;
              return address;
            }

            async stop(): Promise<void> {
              this.#unsubscribe?.();
              this.#unsubscribe = undefined;
              for (const round of this.#rounds.values()) {
                clearTimeout(round.timer);
                round.reject(new Error("Node stopped"));
              }
              this.#rounds.clear();
              for (const waiter of this.#syncWaiters.values()) {
                clearTimeout(waiter.timer);
                waiter.reject(new Error("Node stopped"));
              }
              this.#syncWaiters.clear();
              this.secure.close();
              await this.tcp.stop();
              this.#started = false;
            }

            async propose<T extends JsonObject>(command: DurableCommand<T>): Promise<ProposalResult<T>> {
              if (!this.#started) throw new Error("Node is not started");
              if (!this.isLeader) throw new Error(`${this.identity.id} is not leader for view ${this.quorum.view}`);
              const proposal = this.quorum.proposal(this.identity, this.#state.sequence + 1, command);
              this.#preflight(proposal);
              const certificatePromise = new Promise<CommitCertificate<T>>((resolve, reject) => {
                const timer = setTimeout(() => {
                  this.#rounds.delete(proposal.digest);
                  reject(new Error(`BFT proposal timed out with fewer than ${this.quorum.quorum} votes`));
                }, this.config.proposalTimeoutMs ?? 5_000);
                this.#rounds.set(proposal.digest, {
                  proposal,
                  votes: new Map(),
                  resolve: resolve as (certificate: CommitCertificate) => void,
                  reject,
                  timer,
                });
              });
              this.#acceptVote(this.quorum.vote(this.identity, proposal));
              await this.#broadcast("bft.proposal", proposal as unknown as JsonValue);
              const certificate = await certificatePromise;
              const state = await this.commit(certificate);
              return { proposal, certificate, state };
            }

            async commit(certificate: CommitCertificate, options: { broadcast?: boolean } = {}): Promise<DistributedRuntimeState> {
              let result!: DistributedRuntimeState;
              const execute = async (): Promise<void> => {
                if (!this.quorum.verifyCertificate(certificate)) throw new Error("Invalid BFT commit certificate");
                const command = certificate.proposal.command;
                if (this.#state.appliedCommandIds.includes(command.id)) {
                  result = this.state;
                  return;
                }
                if (certificate.proposal.sequence !== this.#state.sequence + 1) {
                  throw new Error(`Expected sequence ${this.#state.sequence + 1}, got ${certificate.proposal.sequence}`);
                }
                this.#preflight(certificate.proposal);
                await this.certificates.append(certificate);
                await this.store.append(command);
                this.#state = reduceRuntimeState(this.#state, command);
                const checkpointEvery = this.config.checkpointEvery ?? 25;
                if (checkpointEvery > 0 && this.#state.sequence % checkpointEvery === 0) {
                  await this.store.checkpoint(this.#state as DistributedRuntimeState & JsonValue);
                }
                if (options.broadcast !== false) await this.#broadcast("bft.commit", certificate as unknown as JsonValue);
                for (const handler of this.#commitHandlers) await handler(this.state, certificate);
                result = this.state;
              };
              const operation = this.#commitChain.then(execute, execute);
              this.#commitChain = operation.catch(() => undefined);
              await operation;
              return result;
            }

            async synchronizeFrom(peerId: string, timeoutMs = 5_000): Promise<void> {
              const peer = this.#requirePeer(peerId);
              if (this.#syncWaiters.has(peerId)) throw new Error(`Synchronization with ${peerId} is already active`);
              const promise = new Promise<void>((resolve, reject) => {
                const timer = setTimeout(() => {
                  this.#syncWaiters.delete(peerId);
                  reject(new Error(`State synchronization with ${peerId} timed out`));
                }, timeoutMs);
                this.#syncWaiters.set(peerId, { resolve, reject, timer });
              });
              await this.secure.send(peer.address, "bft.sync.request", { fromSequence: this.#state.sequence }, peer.id);
              await promise;
            }

            async requestViewChange(reason: string, toView = this.quorum.view + 1): Promise<void> {
              const change = this.quorum.viewChange(this.identity, reason, toView);
              this.#recordViewChange(change);
              await this.#broadcast("bft.view-change", { change: change as unknown as JsonValue });
            }

            #preflight(proposal: ConsensusProposal): void {
              if (!this.quorum.verifyProposal(proposal)) throw new Error("Proposal signature or digest is invalid");
              if (proposal.sequence !== this.#state.sequence + 1) throw new Error(`Proposal sequence ${proposal.sequence} is not next`);
              reduceRuntimeState(this.#state, proposal.command);
            }

            async #receive(envelope: SignedEnvelope): Promise<void> {
              switch (envelope.topic) {
                case "bft.proposal":
                  await this.#receiveProposal(envelope, envelope.payload as unknown as ConsensusProposal);
                  break;
                case "bft.vote":
                  this.#receiveVote(envelope, envelope.payload as unknown as ConsensusVote);
                  break;
                case "bft.commit":
                  await this.#receiveCommit(envelope.payload as unknown as CommitCertificate, envelope.sender);
                  break;
                case "bft.sync.request":
                  await this.#receiveSyncRequest(envelope, envelope.payload as unknown as SyncRequest);
                  break;
                case "bft.sync.response":
                  await this.#receiveSyncResponse(envelope, envelope.payload as unknown as SyncResponse);
                  break;
                case "bft.view-change":
                  this.#receiveViewChange(envelope, envelope.payload as unknown as ViewChangePayload);
                  break;
              }
            }

            async #receiveProposal(envelope: SignedEnvelope, proposal: ConsensusProposal): Promise<void> {
              if (envelope.sender !== proposal.proposer) return;
              const peer = this.#peers.get(proposal.proposer);
              if (!peer) return;
              let decision: "accept" | "reject" = "accept";
              try {
                this.#preflight(proposal);
              } catch {
                decision = "reject";
              }
              const vote = this.quorum.vote(this.identity, proposal, decision);
              await this.secure.send(peer.address, "bft.vote", vote as unknown as JsonValue, proposal.proposer);
            }

            #receiveVote(envelope: SignedEnvelope, vote: ConsensusVote): void {
              if (envelope.sender !== vote.voter || !this.isLeader) return;
              this.#acceptVote(vote);
            }

            #acceptVote(vote: ConsensusVote): void {
              const round = this.#rounds.get(vote.digest);
              if (!round || !this.quorum.verifyVote(vote, round.proposal)) return;
              round.votes.set(vote.voter, vote);
              const accepted = [...round.votes.values()].filter((candidate) => candidate.decision === "accept");
              if (accepted.length < this.quorum.quorum) return;
              try {
                const certificate = this.quorum.certify(round.proposal, accepted);
                clearTimeout(round.timer);
                this.#rounds.delete(vote.digest);
                round.resolve(certificate);
              } catch (error) {
                round.reject(error instanceof Error ? error : new Error(String(error)));
              }
            }

            async #receiveCommit(certificate: CommitCertificate, sender: string): Promise<void> {
              if (sender !== certificate.proposal.proposer || !this.quorum.verifyCertificate(certificate)) return;
              if (certificate.proposal.sequence <= this.#state.sequence) return;
              if (certificate.proposal.sequence > this.#state.sequence + 1) {
                await this.synchronizeFrom(sender).catch(() => undefined);
                return;
              }
              await this.commit(certificate, { broadcast: false }).catch(() => undefined);
            }

            async #receiveSyncRequest(envelope: SignedEnvelope, request: SyncRequest): Promise<void> {
              const peer = this.#peers.get(envelope.sender);
              if (!peer || !Number.isSafeInteger(request.fromSequence) || request.fromSequence < 0) return;
              const certificates = this.certificates.after(request.fromSequence);
              await this.secure.send(
                peer.address,
                "bft.sync.response",
                { certificates: certificates as unknown as JsonValue[] },
                peer.id,
              );
            }

            async #receiveSyncResponse(envelope: SignedEnvelope, response: SyncResponse): Promise<void> {
              const waiter = this.#syncWaiters.get(envelope.sender);
              if (!waiter || !Array.isArray(response.certificates)) return;
              try {
                const certificates = response.certificates as unknown as CommitCertificate[];
                certificates.sort((a, b) => a.proposal.sequence - b.proposal.sequence);
                for (const certificate of certificates) {
                  if (certificate.proposal.sequence <= this.#state.sequence) continue;
                  await this.commit(certificate, { broadcast: false });
                }
                clearTimeout(waiter.timer);
                this.#syncWaiters.delete(envelope.sender);
                waiter.resolve();
              } catch (error) {
                clearTimeout(waiter.timer);
                this.#syncWaiters.delete(envelope.sender);
                waiter.reject(error instanceof Error ? error : new Error(String(error)));
              }
            }

            #receiveViewChange(envelope: SignedEnvelope, payload: ViewChangePayload): void {
              const change = payload.change as unknown as ViewChange;
              if (envelope.sender !== change.voter) return;
              this.#recordViewChange(change);
            }

            #recordViewChange(change: ViewChange): void {
              if (!this.quorum.verifyViewChange(change)) return;
              const group = this.#viewChanges.get(change.toView) ?? new Map<string, ViewChange>();
              group.set(change.voter, change);
              this.#viewChanges.set(change.toView, group);
              if (group.size >= this.quorum.quorum && change.toView > this.quorum.view) {
                this.quorum.advanceView([...group.values()]);
              }
            }

            async #broadcast(topic: string, payload: JsonValue): Promise<void> {
              await Promise.allSettled(
                [...this.#peers.values()].map((peer) => this.secure.send(peer.address, topic, payload, peer.id)),
              );
            }

            #requirePeer(id: string): DistributedPeer {
              const peer = this.#peers.get(id);
              if (!peer) throw new Error(`Unknown peer ${id}`);
              return peer;
            }
          }
          EOF
          cat > test/network-bft.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { mkdtemp } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import {
            CryptoIdentity,
            NetworkBftGraphNode,
            createGraphCommand,
          } from "../dist/v1/index.js";

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function eventually(predicate, timeoutMs = 5_000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              if (predicate()) return;
              await sleep(10);
            }
            assert.fail("condition was not reached before timeout");
          }

          async function createCluster() {
            const identities = [0, 1, 2, 3].map((index) => CryptoIdentity.generate(`replica-${index}`));
            const committee = identities.map((identity) => identity.publicIdentity());
            const nodes = [];
            const addresses = [];
            for (let index = 0; index < identities.length; index += 1) {
              const node = new NetworkBftGraphNode({
                identity: identities[index],
                committee,
                peers: [],
                storageDirectory: await mkdtemp(join(tmpdir(), `anu-bft-${index}-`)),
                listen: { host: "127.0.0.1", port: 0 },
                proposalTimeoutMs: 2_000,
              });
              nodes.push(node);
              addresses.push(await node.start());
            }
            for (let index = 0; index < nodes.length; index += 1) {
              for (let peer = 0; peer < nodes.length; peer += 1) {
                if (index === peer) continue;
                nodes[index].addPeer({
                  id: identities[peer].id,
                  address: addresses[peer],
                  identity: identities[peer].publicIdentity(),
                });
              }
            }
            return { identities, committee, nodes, addresses };
          }

          test("four independent nodes form a quorum through signed TCP proposal and vote messages", async () => {
            const cluster = await createCluster();
            try {
              const command = createGraphCommand("replica-0", "agent.upsert", {
                agent: { id: "nano:networked", kind: "nano", capabilities: ["observe"], exposedState: { ready: true }, lineage: [] },
              });
              const result = await cluster.nodes[0].propose(command);
              assert.equal(result.certificate.votes.length, 3);
              await eventually(() => cluster.nodes.every((node) => node.state.sequence === 1));
              assert.ok(cluster.nodes.every((node) => node.state.graph.agents.some((agent) => agent.id === "nano:networked")));
            } finally {
              await Promise.allSettled(cluster.nodes.map((node) => node.stop()));
            }
          });

          test("a quorum remains live with one unavailable replica and that replica catches up from certified history", async () => {
            const cluster = await createCluster();
            try {
              const first = createGraphCommand("replica-0", "agent.upsert", {
                agent: { id: "nano:first", kind: "nano", capabilities: ["sense"], exposedState: {}, lineage: [] },
              });
              await cluster.nodes[0].propose(first);
              await eventually(() => cluster.nodes.every((node) => node.state.sequence === 1));
              await cluster.nodes[3].stop();
              const second = createGraphCommand("replica-0", "agent.upsert", {
                agent: { id: "nano:second", kind: "nano", capabilities: ["act"], exposedState: {}, lineage: [] },
              });
              await cluster.nodes[0].propose(second);
              await eventually(() => cluster.nodes.slice(0, 3).every((node) => node.state.sequence === 2));
              assert.equal(cluster.nodes[3].state.sequence, 1);
              const replacement = new NetworkBftGraphNode({
                identity: cluster.identities[3],
                committee: cluster.committee,
                peers: cluster.nodes.slice(0, 3).map((node, index) => ({
                  id: cluster.identities[index].id,
                  address: cluster.addresses[index],
                  identity: cluster.identities[index].publicIdentity(),
                })),
                storageDirectory: cluster.nodes[3].config.storageDirectory,
                listen: { host: "127.0.0.1", port: 0 },
              });
              cluster.nodes[3] = replacement;
              cluster.addresses[3] = await replacement.start();
              for (let index = 0; index < 3; index += 1) {
                cluster.nodes[index].addPeer({ id: cluster.identities[3].id, address: cluster.addresses[3], identity: cluster.identities[3].publicIdentity() });
              }
              await replacement.synchronizeFrom("replica-0");
              assert.equal(replacement.state.sequence, 2);
              assert.ok(replacement.state.graph.agents.some((agent) => agent.id === "nano:second"));
            } finally {
              await Promise.allSettled(cluster.nodes.map((node) => node.stop()));
            }
          });

          test("view-change messages are independently signed and advance only after quorum", async () => {
            const cluster = await createCluster();
            try {
              await Promise.all(cluster.nodes.slice(0, 3).map((node) => node.requestViewChange("leader timeout", 1)));
              await eventually(() => cluster.nodes.every((node) => node.quorum.view === 1));
              assert.equal(cluster.nodes[1].isLeader, true);
            } finally {
              await Promise.allSettled(cluster.nodes.map((node) => node.stop()));
            }
          });
          EOF
          python - <<'PY'
          from pathlib import Path
          path = Path('src/v1/index.ts')
          text = path.read_text()
          line = 'export * from "./network-bft-node.js";\n'
          if line not in text:
              text += line
          path.write_text(text)
          PY
      - run: npm ci --ignore-scripts
      - name: Verify complete runtime and networked BFT
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/anu-network-bft.log
          grep -q '^# fail 0$' /tmp/anu-network-bft.log
      - name: Commit verified networked BFT layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v1/network-bft-node.ts src/v1/index.ts test/network-bft.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Networked BFT layer already current"
            exit 0
          fi
          git commit -m "Implement networked Byzantine consensus rounds"
          git pull --rebase origin master
          git push origin HEAD:master
