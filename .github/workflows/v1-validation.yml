name: distributed-v1-validation

on:
  push:
    branches: [master]
    paths:
      - "src/v1/**"
      - "src/distributed-v1.ts"
      - "test/distributed-v1.test.mjs"
      - "package.json"
      - "docs/DISTRIBUTED_V1.md"
      - ".github/workflows/v1-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Build and run all tests
        run: npm run check
      - name: Record verified runtime state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          cat > validation/distributed-v1.json <<JSON
          {
            "sourceCommit": "${GITHUB_SHA}",
            "node": "$(node --version)",
            "status": "verified",
            "tests": 39,
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/distributed-v1.json
          git commit -m "Record distributed v1 validation"
          git push origin HEAD:master
