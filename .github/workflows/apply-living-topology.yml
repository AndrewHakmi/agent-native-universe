name: apply living topology

on:
  push:
    branches: [master]
    paths:
      - ".anu-bootstrap/**"
      - ".github/workflows/apply-living-topology.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize exact repository tree
        shell: bash
        run: |
          set -euo pipefail
          cat .anu-bootstrap/archive.part-* | base64 -d > /tmp/agent-native-universe.tar.gz
          echo "f0a51aff7151c7450bae0ef3332439c0357032fb23ab3a8c4eeffdd894e1ec33  /tmp/agent-native-universe.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/agent-native-universe.tar.gz -C .
      - name: Validate living topology runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm test
          npm run demo:living
          git diff --check
      - name: Commit verified repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement living agent topology"
          git push origin HEAD:master
