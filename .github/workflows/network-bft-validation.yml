name: network-bft-validation

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/network-bft-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Execute complete test universe
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/anu-tests.log
          grep -q '^# fail 0$' /tmp/anu-tests.log
      - name: Persist exact validation evidence
        shell: bash
        run: |
          set -euo pipefail
          tests="$(awk '/^# tests / {value=$3} END {print value}' /tmp/anu-tests.log)"
          test -n "$tests"
          mkdir -p validation
          cat > validation/distributed-v1.json <<JSON
          {
            "sourceCommit": "${GITHUB_SHA}",
            "node": "$(node --version)",
            "status": "verified",
            "tests": ${tests},
            "failures": 0,
            "networkBft": true,
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/distributed-v1.json
          git diff --cached --check
          git commit -m "Record networked BFT validation"
          git pull --rebase origin master
          git push origin HEAD:master
